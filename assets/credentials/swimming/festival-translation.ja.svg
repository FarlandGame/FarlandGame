<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ja"><title>参加証明書 — 非公式の翻訳・閲覧用</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Yu Gothic, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">非公式の翻訳・閲覧用</text><text x="95" y="160" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Yu Gothic, Vazirmatn" font-size="54" font-weight="700" fill="#183438">参加証明書</text><text x="95" y="368" font-family="Yu Gothic, Vazirmatn" font-size="36" font-weight="700" fill="#183438">水泳フェスティバル</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">至高なる神の御名において</text><text x="110" y="550" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">イラン・イスラム共和国／スポーツ・青少年省</text><text x="110" y="595" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">マラーゲ郡スポーツ・青少年局</text><text x="110" y="665" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">日付：1403/06/25（太陽ヒジュラ暦）</text><text x="110" y="710" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">受領者：Bardiya Alizadeh</text><text x="110" y="780" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">全能の神の助け、指導者による貴重な教え、そしてご自身の努力により、1403年、聖</text><text x="110" y="825" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">なる防衛週間に合わせてマラーゲのAthar Poolで開催された水泳フェスティバルに参加</text><text x="110" y="870" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">されたことを認め、この証明書を授与します。</text><text x="110" y="940" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">神の助けのもと、信仰ある若い選手の優れた模範であり続けることを願います。</text><text x="110" y="1010" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Mohammad Khorsandi</text><text x="110" y="1055" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">マラーゲ郡水泳・飛込・水球委員会会長</text><text x="110" y="1125" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">注記：手書きで省略された年は、本文の年をもとに補っています。証明書番号欄は空</text><text x="110" y="1170" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">白です。順位・泳法・距離・年齢区分は記載されていません。Rasad Poolでの1位とい</text><text x="110" y="1215" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">う本人の記憶は、この書類とは区別しています。</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">日付は太陽ヒジュラ暦です。印章・署名は複製していません。</text><text x="95" y="1620" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">原本をご参照ください。この画像は公的な再発行ではありません。</text><text x="95" y="1655" font-family="Yu Gothic, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>