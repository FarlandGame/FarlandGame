<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="en"><title>Certificate of participation — UNOFFICIAL READING COPY</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">UNOFFICIAL READING COPY</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">PORTFOLIO TRANSLATION / TRANSCRIPTION</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Certificate of participation</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Swimming festival</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">In the name of the Exalted God</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Islamic Republic of Iran · Ministry of Sport and Youth</text><text x="110" y="595" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Sports and Youth Administration, Maragheh County</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Date: 1403/06/25 (Solar Hijri)</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Recipient: Bardiya Alizadeh</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">With the help of Almighty God, the valuable instruction of your coaches and your</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">own efforts, you participated in the swimming festival held in 1403 on the occasion</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">of Sacred Defence Week at Athar Pool, Maragheh, and are therefore awarded this</text><text x="110" y="915" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">certificate.</text><text x="110" y="985" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">We hope that, with divine assistance, you will always be an outstanding example of</text><text x="110" y="1030" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">a faithful young athlete.</text><text x="110" y="1100" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Mohammad Khorsandi</text><text x="110" y="1145" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Chair, Swimming, Diving and Water Polo Board, Maragheh County</text><text x="110" y="1215" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Reading notes: the handwritten abbreviated date is expanded using the year</text><text x="110" y="1260" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">stated in the text. The certificate-number field is blank. No placing, stroke, distance</text><text x="110" y="1305" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">or age category is stated. The creator’s recollection of first place at Rasad Pool is</text><text x="110" y="1350" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">separate from this document.</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Dates retain the Solar Hijri calendar. No seal or signature is recreated.</text><text x="95" y="1620" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">The supplied original is authoritative. This is not an official reissue.</text><text x="95" y="1655" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>