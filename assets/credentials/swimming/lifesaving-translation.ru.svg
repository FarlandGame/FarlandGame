<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ru"><title>Свидетельство об участии — НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Свидетельство об участии</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Nedaye Omid · спасение на воде</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Во имя Всевышнего</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Уважаемый спортсмен!</text><text x="110" y="620" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Благодаря помощи Всемогущего, ценным наставлениям тренеров и</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">собственным усилиям вы приняли участие в первых соревнованиях по</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">спасению на воде «Nedaye Omid Festival» в 1403 году в [название округа,</text><text x="110" y="755" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">вписанное от руки, не удалось уверенно прочитать] и удостаиваетесь этого</text><text x="110" y="800" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">свидетельства.</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Желаем вам, полагаясь на Всемогущего, успехов во всех жизненных целях,</text><text x="110" y="915" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">особенно в развитии и распространении спортивного спасения на воде.</text><text x="110" y="985" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">На оригинале напечатаны, среди прочих, знаки Совета по спасению на воде</text><text x="110" y="1030" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">и дайвингу Восточного Азербайджана и Федерации спасения на воде и</text><text x="110" y="1075" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">дайвинга Исламской Республики Иран.</text><text x="110" y="1145" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Примечания: переведён читаемый основной текст. Мелкая декоративная</text><text x="110" y="1190" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">цитата и неясные детали подписей и печатей не восстановлены. В основном</text><text x="110" y="1235" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">тексте не указаны личное имя и занятое место. Это свидетельство участия, а</text><text x="110" y="1280" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">не профессиональная квалификация или лицензия спасателя.</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Даты по солнечной хиджре. Печати и подписи не воспроизведены.</text><text x="95" y="1620" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Приоритет имеет оригинал. Это не повторно выданный официальный документ.</text><text x="95" y="1655" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>