<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ja"><title>参加証明書 — 非公式の翻訳・閲覧用</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Yu Gothic, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">非公式の翻訳・閲覧用</text><text x="95" y="160" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Yu Gothic, Vazirmatn" font-size="54" font-weight="700" fill="#183438">参加証明書</text><text x="95" y="368" font-family="Yu Gothic, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Nedaye Omid・ライフセービング競技</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">至高なる神の御名において</text><text x="110" y="550" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">選手の皆様へ</text><text x="110" y="620" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">全能の神の助け、指導者による貴重な教え、そしてご自身の努力により、1403年に［</text><text x="110" y="665" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">手書きの郡名は確実に判読できません］で開催された、第1回ライフセービング競技「</text><text x="110" y="710" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Nedaye Omid Festival」に参加されたことを認め、この証明書を授与します。</text><text x="110" y="780" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">全能の神を頼りとして、人生のあらゆる目標、特にライフセービング競技の振興と発</text><text x="110" y="825" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">展において成功されることを願います。</text><text x="110" y="895" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">原本には、東アゼルバイジャン州ライフセービング・ダイビング委員会、およびイラ</text><text x="110" y="940" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">ン・イスラム共和国ライフセービング・ダイビング連盟などの組織名・標章が印刷さ</text><text x="110" y="985" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">れています。</text><text x="110" y="1055" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">注記：判読できる本文を訳しています。小さな装飾用の引用文、不鮮明な署名・押印</text><text x="110" y="1100" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">の詳細は再構成していません。本文に個人名や順位は記載されていません。これは参</text><text x="110" y="1145" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">加記録であり、職業上のライフガード資格や免許ではありません。</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">日付は太陽ヒジュラ暦です。印章・署名は複製していません。</text><text x="95" y="1620" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">原本をご参照ください。この画像は公的な再発行ではありません。</text><text x="95" y="1655" font-family="Yu Gothic, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>