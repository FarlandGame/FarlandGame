<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1710" viewBox="0 0 1400 1710" lang="ru"><title>Свидетельство об участии — НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</title><rect width="1400" height="1710" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1640" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Свидетельство об участии</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Фестиваль плавания</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Во имя Всевышнего</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Исламская Республика Иран · Министерство спорта и молодёжи</text><text x="110" y="595" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Управление спорта и молодёжи округа Мараге</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Дата: 1403/06/25 (солнечная хиджра)</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Получатель: Бардия Ализаде</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Благодаря помощи Всемогущего, ценным наставлениям тренеров и</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">собственным усилиям вы приняли участие в фестивале плавания,</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">проведённом в 1403 году по случаю Недели священной обороны в бассейне</text><text x="110" y="915" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Athar в Мараге, и удостаиваетесь этого свидетельства.</text><text x="110" y="985" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Желаем вам с Божьей помощью всегда быть достойным примером</text><text x="110" y="1030" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">верующего молодого спортсмена.</text><text x="110" y="1100" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Мохаммад Хорсанди</text><text x="110" y="1145" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Председатель совета по плаванию, прыжкам в воду и водному поло округа</text><text x="110" y="1190" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Мараге</text><text x="110" y="1260" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Примечания: сокращённая рукописная дата дополнена по году в тексте. Поле</text><text x="110" y="1305" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">номера пустое. Место, стиль плавания, дистанция и возрастная категория не</text><text x="110" y="1350" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">указаны. Воспоминание автора о первом месте в бассейне Rasad не</text><text x="110" y="1395" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">отождествляется с этим документом.</text><path d="M95 1540H1305" stroke="#b58a5e"/><text x="95" y="1590" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Даты по солнечной хиджре. Печати и подписи не воспроизведены.</text><text x="95" y="1630" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Приоритет имеет оригинал. Это не повторно выданный официальный документ.</text><text x="95" y="1665" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>