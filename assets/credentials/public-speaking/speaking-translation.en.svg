<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="en"><title>Course completion — UNOFFICIAL READING COPY</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">UNOFFICIAL READING COPY</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">PORTFOLIO TRANSLATION / TRANSCRIPTION</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Course completion</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Public speaking &amp; presentation</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Rahkar Academy</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Recipient: Bardia Alizadeh</text><text x="110" y="620" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">This certifies that Bardia Alizadeh completed the comprehensive training course in</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">the art of expression and presentation skills, comprising 30 hours, from</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">1403/05/26 to 1403/06/31, and achieved a passing grade of 100 out of 100.</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Training duration: 30 hours</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Recorded grade: 100/100</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Certificate number: 1258948</text><text x="110" y="915" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Certificate date: 1403/06/31</text><text x="110" y="960" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Trainer named on the source: Taha Bamshad</text><text x="110" y="1005" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">National ID: redacted</text><text x="110" y="1075" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">The source certificate is already in English. Bardia is the spelling printed on it;</text><text x="110" y="1120" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Bardiya is the portfolio spelling. This is a readable transcription, not an official</text><text x="110" y="1165" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">reissue. The decorative badge on the source does not establish an additional</text><text x="110" y="1210" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">competition award.</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Dates retain the Solar Hijri calendar. No seal or signature is recreated.</text><text x="95" y="1620" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">The supplied original is authoritative. This is not an official reissue.</text><text x="95" y="1655" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>