<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ja"><title>講座修了証 — 非公式の翻訳・閲覧用</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Yu Gothic, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">非公式の翻訳・閲覧用</text><text x="95" y="160" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Yu Gothic, Vazirmatn" font-size="54" font-weight="700" fill="#183438">講座修了証</text><text x="95" y="368" font-family="Yu Gothic, Vazirmatn" font-size="36" font-weight="700" fill="#183438">スピーチ・プレゼンテーション</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Rahkar Academy</text><text x="110" y="550" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">受講者：Bardia Alizadeh</text><text x="110" y="620" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Bardia Alizadehが、表現技法とプレゼンテーション技能に関する総合講座を修了した</text><text x="110" y="665" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">ことを証します。講座は1403/05/26から1403/06/31までの計30時間で、合格評点は10</text><text x="110" y="710" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">0点満点中100点でした。</text><text x="110" y="780" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">受講時間：30時間</text><text x="110" y="825" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">記載された評点：100/100</text><text x="110" y="870" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">証明書番号：1258948</text><text x="110" y="915" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">証明書の日付：1403/06/31</text><text x="110" y="960" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">原本に記名された講師：Taha Bamshad</text><text x="110" y="1005" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">国民識別番号：非公開</text><text x="110" y="1075" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">原本は英語です。受講者名は原本ではBardia、ポートフォリオではBardiyaと表記して</text><text x="110" y="1120" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">います。この画像は非公式の日本語訳で、公的な再発行ではありません。原本の装飾</text><text x="110" y="1165" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">バッジは、別の競技での受賞を証明するものではありません。</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">日付は太陽ヒジュラ暦です。印章・署名は複製していません。</text><text x="95" y="1620" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">原本をご参照ください。この画像は公的な再発行ではありません。</text><text x="95" y="1655" font-family="Yu Gothic, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>