<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ru"><title>Свидетельство об окончании курса — НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Свидетельство об окончании курса</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">Ораторское мастерство и презентации</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Академия Rahkar</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Получатель: Bardia Alizadeh</text><text x="110" y="620" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Настоящим удостоверяется, что Bardia Alizadeh прошёл комплексный курс по</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">технике речи и навыкам презентации продолжительностью 30 часов с</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">1403/05/26 по 1403/06/31 и получил проходной балл 100 из 100.</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Продолжительность: 30 часов</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Указанная оценка: 100/100</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Номер свидетельства: 1258948</text><text x="110" y="915" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Дата свидетельства: 1403/06/31</text><text x="110" y="960" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Преподаватель, указанный в оригинале: Таха Бамшад</text><text x="110" y="1005" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Национальный идентификационный номер: скрыт</text><text x="110" y="1075" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Оригинал составлен на английском языке. В нём имя написано Bardia, а в</text><text x="110" y="1120" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">портфолио используется Bardiya. Это неофициальный перевод, а не</text><text x="110" y="1165" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">повторно выданный документ. Декоративный значок на оригинале не</text><text x="110" y="1210" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">подтверждает отдельную конкурсную награду.</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Даты по солнечной хиджре. Печати и подписи не воспроизведены.</text><text x="95" y="1620" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Приоритет имеет оригинал. Это не повторно выданный официальный документ.</text><text x="95" y="1655" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>